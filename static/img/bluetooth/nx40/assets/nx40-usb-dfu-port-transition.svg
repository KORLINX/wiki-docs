<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">NX40 USB DFU port transition</title><desc id="desc">Three-state flat diagram showing the application port, temporary DFU transition, and restored application port.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#16a3a5"/></marker></defs>
  <rect width="1600" height="820" fill="#f7f9fc"/><text x="800" y="78" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#0b1f3a">Normal USB port transition during upload</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(110 180)"><rect width="380" height="470" rx="30" fill="#fff" stroke="#d9e1ea" stroke-width="3"/><circle cx="190" cy="78" r="38" fill="#16a3a5"/><text x="190" y="91" font-size="34" font-weight="700" fill="#fff">1</text><text x="190" y="145" font-size="27" font-weight="700" fill="#0b1f3a">Application port</text><rect x="55" y="190" width="270" height="120" rx="18" fill="#eef3f7"/><circle cx="102" cy="250" r="18" fill="#22c55e"/><text x="218" y="242" font-size="22" font-weight="700" fill="#0b1f3a">DEV-NX40</text><text x="218" y="276" font-size="19" fill="#66768a">COM7 / ttyACM0</text><text x="190" y="365" font-size="20" fill="#5b6b80">IDE performs a</text><text x="190" y="396" font-size="20" font-weight="700" fill="#0b5960">1200-bps touch</text></g>
    <g transform="translate(610 180)"><rect width="380" height="470" rx="30" fill="#fff" stroke="#f59e0b" stroke-width="4"/><circle cx="190" cy="78" r="38" fill="#f59e0b"/><text x="190" y="91" font-size="34" font-weight="700" fill="#fff">2</text><text x="190" y="145" font-size="27" font-weight="700" fill="#0b1f3a">DFU transition</text><rect x="55" y="190" width="270" height="120" rx="18" fill="#fff2d6"/><path d="M110 250h160" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 16"/><text x="190" y="350" font-size="20" fill="#5b6b80">The port may briefly</text><text x="190" y="381" font-size="20" font-weight="700" fill="#7a4b00">disappear or change</text></g>
    <g transform="translate(1110 180)"><rect width="380" height="470" rx="30" fill="#fff" stroke="#d9e1ea" stroke-width="3"/><circle cx="190" cy="78" r="38" fill="#16a3a5"/><text x="190" y="91" font-size="34" font-weight="700" fill="#fff">3</text><text x="190" y="145" font-size="27" font-weight="700" fill="#0b1f3a">Application restarts</text><rect x="55" y="190" width="270" height="120" rx="18" fill="#eef3f7"/><circle cx="102" cy="250" r="18" fill="#22c55e"/><text x="218" y="242" font-size="22" font-weight="700" fill="#0b1f3a">DEV-NX40</text><text x="218" y="276" font-size="19" fill="#66768a">Port available again</text><text x="190" y="365" font-size="20" fill="#5b6b80">Upload complete</text><text x="190" y="396" font-size="20" font-weight="700" fill="#0b5960">Sketch is running</text></g>
  </g>
  <g stroke="#16a3a5" stroke-width="7" marker-end="url(#arr)"><path d="M510 420h80"/><path d="M1010 420h80"/></g>
  <rect x="370" y="700" width="860" height="62" rx="31" fill="#e8f7f7"/><text x="800" y="740" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#0b5960">Do not disconnect the USB cable during this transition.</text>
</svg>
