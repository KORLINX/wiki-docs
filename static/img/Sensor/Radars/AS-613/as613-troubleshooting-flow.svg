<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">AS-613 troubleshooting flow</title><desc id="desc">A decision flow from power and serial checks to application validation.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#0f766e"/></marker><style>.t{font:700 30px Arial;fill:#172554}.h{font:700 19px Arial;fill:#172554}.n{font:16px Arial;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arrow{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#a)}.tag{font:700 14px Arial;fill:#0f766e}</style></defs>
  <rect width="1280" height="760" rx="24" fill="#f8fafc"/><text x="55" y="60" class="t">Troubleshooting: collect evidence in order</text>
  <g transform="translate(470 95)"><rect width="340" height="80" rx="16" class="box"/><text x="170" y="48" text-anchor="middle" class="h">1 · Power and serial readable?</text></g><path d="M640 175V215" class="arrow"/>
  <g transform="translate(470 215)"><rect width="340" height="80" rx="16" class="box"/><text x="170" y="48" text-anchor="middle" class="h">2 · Commands return =...!?</text></g><path d="M640 295V335" class="arrow"/>
  <g transform="translate(470 335)"><rect width="340" height="80" rx="16" class="box"/><text x="170" y="48" text-anchor="middle" class="h">3 · Coordinates match setup?</text></g><path d="M640 415V455" class="arrow"/>
  <g transform="translate(470 455)"><rect width="340" height="80" rx="16" class="box"/><text x="170" y="48" text-anchor="middle" class="h">4 · Interference controlled?</text></g><path d="M640 535V575" class="arrow"/>
  <g transform="translate(470 575)"><rect width="340" height="80" rx="16" fill="#e6f7f5" stroke="#0f766e" stroke-width="2"/><text x="170" y="36" text-anchor="middle" class="h">5 · Mode and license valid?</text><text x="170" y="62" text-anchor="middle" class="n">Then validate the application.</text></g>
  <path d="M470 135H290" class="arrow"/><text x="375" y="125" class="tag">NO</text><rect x="55" y="90" width="235" height="120" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="172" y="125" text-anchor="middle" class="h">Check hardware</text><text x="172" y="155" text-anchor="middle" class="n">supply · ground · TX/RX</text><text x="172" y="182" text-anchor="middle" class="n">NRST · baud · connector</text>
  <path d="M810 255H995" class="arrow"/><text x="900" y="245" class="tag">NO</text><rect x="995" y="210" width="235" height="110" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="1112" y="248" text-anchor="middle" class="h">Check protocol</text><text x="1112" y="280" text-anchor="middle" class="n">lowercase · LF/CR · timing</text>
  <path d="M470 375H290" class="arrow"/><text x="375" y="365" class="tag">NO</text><rect x="55" y="330" width="235" height="110" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="172" y="368" text-anchor="middle" class="h">Check geometry</text><text x="172" y="400" text-anchor="middle" class="n">rotate · walltilt · ROI</text>
  <path d="M810 495H995" class="arrow"/><text x="900" y="485" class="tag">NO</text><rect x="995" y="450" width="235" height="110" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="1112" y="488" text-anchor="middle" class="h">Inspect environment</text><text x="1112" y="520" text-anchor="middle" class="n">fans · curtains · metal · motion</text>
  <path d="M470 615H290" class="arrow"/><text x="375" y="605" class="tag">NO</text><rect x="55" y="570" width="235" height="110" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="172" y="608" text-anchor="middle" class="h">Confirm unit</text><text x="172" y="640" text-anchor="middle" class="n">firmware · mode · license</text>
  <text x="640" y="715" text-anchor="middle" class="n">Record raw logs, setup photos, geometry, firmware, test conditions, and timestamps before changing sensitivity.</text>
</svg>
