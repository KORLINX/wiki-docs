<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">AS-613 packet anatomy</title><desc id="desc">Color-coded examples explaining delimiters, target index, position, energy, and variable packet families.</desc>
  <defs><style>.t{font:700 30px Arial;fill:#172554}.h{font:700 21px Arial;fill:#172554}.b{font:18px Arial;fill:#334155}.mono{font:700 27px monospace}.n{font:16px Arial;fill:#475569}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.s{fill:#dbeafe}.i{fill:#ede9fe}.x{fill:#ccfbf1}.z{fill:#fef3c7}.e{fill:#fee2e2}.end{fill:#e2e8f0}</style></defs>
  <rect width="1400" height="820" rx="24" fill="#f8fafc"/><text x="55" y="60" class="t">Frame anatomy for host parsers</text>
  <rect x="55" y="100" width="1290" height="170" rx="18" class="card"/><text x="85" y="140" class="h">Mode 1 position packet</text>
  <g transform="translate(85 165)"><rect width="70" height="60" rx="8" class="s"/><text x="35" y="40" text-anchor="middle" class="mono">#</text><rect x="75" width="70" height="60" rx="8" class="i"/><text x="110" y="40" text-anchor="middle" class="mono">A</text><rect x="150" width="230" height="60" rx="8" class="x"/><text x="265" y="40" text-anchor="middle" class="mono">BBBB</text><rect x="385" width="180" height="60" rx="8" class="z"/><text x="475" y="40" text-anchor="middle" class="mono">CCC</text><rect x="570" width="180" height="60" rx="8" class="e"/><text x="660" y="40" text-anchor="middle" class="mono">DDD</text><rect x="755" width="70" height="60" rx="8" class="end"/><text x="790" y="40" text-anchor="middle" class="mono">!</text></g>
  <text x="1020" y="175" class="b">A target index</text><text x="1020" y="205" class="b">BBBB signed X (cm)</text><text x="1020" y="235" class="b">CCC positive Z (cm) · DDD energy</text>
  <rect x="55" y="300" width="610" height="205" rx="18" class="card"/><text x="85" y="345" class="h">Vacancy packet</text><text x="85" y="405" class="mono" fill="#172554">#0!</text><text x="85" y="455" class="n">Short frames are valid. Do not assume one fixed length.</text>
  <rect x="735" y="300" width="610" height="205" rx="18" class="card"/><text x="765" y="345" class="h">Response frame</text><text x="765" y="405" class="mono" fill="#172554">= ... !</text><text x="765" y="455" class="n">Classify responses separately from continuous data.</text>
  <rect x="55" y="535" width="1290" height="210" rx="18" class="card"/><text x="85" y="580" class="h">Parser checks for every documented start character</text><text x="85" y="625" class="b">1. Buffer from start marker through “!”</text><text x="85" y="663" class="b">2. Select the packet schema by active mode, marker, and length</text><text x="85" y="701" class="b">3. Validate units, signedness, numeric base, and field availability</text><text x="735" y="625" class="b">4. Reject malformed and undocumented variants</text><text x="735" y="663" class="b">5. Retain the raw frame with a timestamp</text><text x="735" y="701" class="b">6. Do not infer unavailable-value or overflow codes</text>
  <text x="700" y="785" text-anchor="middle" class="n">See the command reference for each mode-specific frame definition.</text>
</svg>
