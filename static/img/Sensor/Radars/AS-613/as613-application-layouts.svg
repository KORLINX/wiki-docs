<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AS-613 application mode installation layouts</title><desc id="desc">Restroom, hospital bed, and presence-mode installation geometry.</desc>
  <defs><style>.t{font:700 30px Arial;fill:#172554}.h{font:700 22px Arial;fill:#172554}.b{font:17px Arial;fill:#334155}.n{font:15px Arial;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.roi{fill:#ccfbf1;fill-opacity:.7;stroke:#0f766e;stroke-width:3;stroke-dasharray:9 6}.dim{stroke:#4338ca;stroke-width:3;stroke-dasharray:7 5}</style></defs>
  <rect width="1440" height="900" rx="24" fill="#f8fafc"/><text x="55" y="58" class="t">Application-mode installation geometry</text>
  <rect x="45" y="90" width="420" height="750" rx="18" class="panel"/><text x="255" y="132" text-anchor="middle" class="h">Mode 12 · Restroom</text><rect x="95" y="180" width="320" height="290" fill="#f1f5f9" stroke="#64748b" stroke-width="5"/><path d="M215 470V400A70 70 0 0 1 285 470" fill="none" stroke="#64748b" stroke-width="4"/><rect x="130" y="215" width="250" height="210" class="roi"/><circle cx="255" cy="205" r="18" fill="#111827"/><text x="280" y="208" class="n">ceiling radar</text><line x1="255" y1="205" x2="255" y2="600" class="dim"/><text x="270" y="550" class="b">rrsh</text><line x1="215" y1="495" x2="285" y2="495" class="dim"/><text x="250" y="525" text-anchor="middle" class="b">rrdoorwd</text><text x="115" y="645" class="b">Measure:</text><text x="115" y="680" class="n">door center: rrdoorx / rrdoorz</text><text x="115" y="710" class="n">ceiling height: rrsh</text><text x="115" y="740" class="n">door width: rrdoorwd</text><text x="115" y="785" class="n">Exclude fixtures outside the stall ROI.</text>
  <rect x="510" y="90" width="420" height="750" rx="18" class="panel"/><text x="720" y="132" text-anchor="middle" class="h">Mode 13 · Hospital bed</text><rect x="580" y="410" width="280" height="145" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><rect x="610" y="430" width="80" height="55" rx="12" fill="#fff"/><text x="720" y="590" text-anchor="middle" class="b">bed width · hbw</text><line x1="580" y1="570" x2="860" y2="570" class="dim"/><circle cx="645" cy="225" r="18" fill="#111827"/><text x="675" y="230" class="n">ceiling view</text><line x1="645" y1="245" x2="645" y2="410" class="dim"/><text x="660" y="335" class="b">hoffset</text><path d="M560 370H880V640H560Z" class="roi"/><text x="720" y="665" text-anchor="middle" class="n">monitored perimeter</text><line x1="820" y1="255" x2="820" y2="410" class="dim"/><text x="835" y="330" class="b">170 cm</text><line x1="645" y1="380" x2="720" y2="380" class="dim"/><text x="680" y="370" text-anchor="middle" class="b">75 cm</text><g transform="translate(770 255) rotate(25)"><rect x="-25" y="-16" width="50" height="32" rx="5" fill="#111827"/></g><text x="735" y="205" class="n">wall option: 25° orientation</text><text x="550" y="770" class="n">Use measured geometry; do not interpolate defaults.</text>
  <rect x="975" y="90" width="420" height="750" rx="18" class="panel"/><text x="1185" y="132" text-anchor="middle" class="h">Mode 14 · Presence</text><rect x="1030" y="190" width="310" height="300" fill="#f1f5f9" stroke="#64748b" stroke-width="5"/><path d="M1030 370H1100A70 70 0 0 0 1030 300" fill="none" stroke="#64748b" stroke-width="4"/><rect x="1070" y="225" width="230" height="225" class="roi"/><circle cx="1185" cy="245" r="17" fill="#111827"/><circle cx="1140" cy="320" r="20" fill="#14b8a6"/><circle cx="1240" cy="385" r="20" fill="#60a5fa"/><text x="1050" y="535" class="b">1. Define ROI first</text><text x="1050" y="570" class="b">2. Set entrance geometry</text><text x="1050" y="605" class="n">doorx · doorz · doorwd</text><text x="1050" y="645" class="b">3. Select wall / ceiling / corner</text><text x="1050" y="680" class="n">cornerleft or cornerright</text><text x="1050" y="725" class="b">4. Verify presence slots</text><text x="1050" y="765" class="n">Vital output follows the closest person.</text>
  <text x="720" y="875" text-anchor="middle" class="n">Illustrative geometry based on User Manual v1.3.1. Measure the actual installation before configuration.</text>
</svg>
