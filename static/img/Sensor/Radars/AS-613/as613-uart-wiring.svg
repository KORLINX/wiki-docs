<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">AS-613 power and UART wiring</title><desc id="desc">Regulated supply and crossed 3.3 volt TTL UART connections with common ground.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#0f766e"/></marker><style>.t{font:700 30px Arial;fill:#172554}.h{font:700 22px Arial;fill:#172554}.b{font:18px Arial;fill:#334155}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.wire{fill:none;stroke-width:5}.note{font:16px Arial;fill:#475569}</style></defs>
  <rect width="1280" height="700" rx="24" fill="#f8fafc"/><text x="60" y="62" class="t">First connection: regulated power + 3.3 V TTL UART</text>
  <rect x="500" y="145" width="280" height="400" rx="22" fill="#111827"/><text x="640" y="205" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">AS-613</text><rect x="585" y="235" width="110" height="72" rx="8" fill="#d1d5db"/><text x="640" y="280" text-anchor="middle" class="b">J1 USB-C</text>
  <text x="525" y="355" class="h" fill="#fff">VCC</text><text x="525" y="405" class="h" fill="#fff">GND</text><text x="525" y="455" class="h" fill="#fff">UART TX</text><text x="525" y="505" class="h" fill="#fff">UART RX</text><text x="680" y="355" class="h" fill="#fff">NRST</text>
  <rect x="65" y="235" width="300" height="200" rx="18" class="box"/><text x="215" y="280" text-anchor="middle" class="h">Regulated supply</text><text x="215" y="322" text-anchor="middle" class="b">3.3–5.5 VDC</text><text x="215" y="355" text-anchor="middle" class="b">Up to 800 mW</text><text x="215" y="400" text-anchor="middle" class="note">V+          GND</text>
  <path d="M365 355H500" class="wire" stroke="#dc2626"/><path d="M365 405H500" class="wire" stroke="#334155"/>
  <rect x="915" y="225" width="300" height="250" rx="18" class="box"/><text x="1065" y="272" text-anchor="middle" class="h">USB–TTL adapter</text><text x="1065" y="310" text-anchor="middle" class="b">3.3 V logic</text><text x="950" y="365" class="b">RX</text><text x="950" y="415" class="b">TX</text><text x="950" y="455" class="b">GND</text>
  <path d="M780 455C845 455 855 365 915 365" class="wire" stroke="#0f766e" marker-end="url(#a)"/><path d="M915 415C850 415 845 505 780 505" class="wire" stroke="#2563eb" marker-end="url(#a)"/><path d="M780 405C850 405 850 455 915 455" class="wire" stroke="#334155"/>
  <text x="815" y="342" class="note">Cross TX ↔ RX</text><text x="640" y="585" text-anchor="middle" class="b">Leave NRST open or High for normal operation.</text>
  <rect x="380" y="615" width="520" height="52" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="640" y="648" text-anchor="middle" class="b">USB-C is a separate documented power path. Avoid dual-power connection.</text>
</svg>
