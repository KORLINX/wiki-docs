<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">AS-613 interface paths</title><desc id="desc">Documented power, UART, GPIO, and USB-C functions and their evidence status.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#0f766e"/></marker><style>.t{font:700 30px Arial;fill:#172554}.h{font:700 22px Arial;fill:#172554}.b{font:18px Arial;fill:#334155}.n{font:16px Arial;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.ok{fill:#e6f7f5;stroke:#0f766e;stroke-width:2}.limited{fill:#fff7ed;stroke:#f97316;stroke-width:2}.arrow{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1280" height="650" rx="24" fill="#f8fafc"/><text x="60" y="62" class="t">Choose the documented interface path</text>
  <rect x="500" y="235" width="280" height="180" rx="22" fill="#111827"/><text x="640" y="318" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#fff">AS-613</text><text x="640" y="355" text-anchor="middle" font-family="Arial" font-size="18" fill="#cbd5e1">ordered connector option</text>
  <rect x="55" y="120" width="340" height="130" rx="18" class="ok"/><text x="225" y="162" text-anchor="middle" class="h">Power</text><text x="225" y="197" text-anchor="middle" class="b">VCC + GND · 3.3–5.5 VDC</text><text x="225" y="225" text-anchor="middle" class="n">Use one verified power source.</text><path d="M395 190C455 190 455 265 500 265" class="arrow"/>
  <rect x="55" y="360" width="340" height="155" rx="18" class="ok"/><text x="225" y="405" text-anchor="middle" class="h">TTL UART</text><text x="225" y="440" text-anchor="middle" class="b">Documented command + data path</text><text x="225" y="470" text-anchor="middle" class="n">3.3 V · ASCII · 8-N-1</text><path d="M395 430C455 430 455 385 500 385" class="arrow"/>
  <rect x="885" y="120" width="340" height="155" rx="18" class="limited"/><text x="1055" y="162" text-anchor="middle" class="h">USB-C</text><text x="1055" y="197" text-anchor="middle" class="b">Power input; USB is listed</text><text x="1055" y="227" text-anchor="middle" class="n">USB class/data procedure not documented</text><path d="M885 205C830 205 830 275 780 275" class="arrow"/>
  <rect x="885" y="370" width="340" height="145" rx="18" class="limited"/><text x="1055" y="412" text-anchor="middle" class="h">GPIO / NRST</text><text x="1055" y="447" text-anchor="middle" class="b">Status output and reset</text><text x="1055" y="477" text-anchor="middle" class="n">Electrical limits are not specified</text><path d="M885 440C830 440 830 385 780 385" class="arrow"/>
  <text x="640" y="590" text-anchor="middle" class="b">Use UART for the documented host command-and-data interface.</text>
</svg>
