<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">AS-613 UART host state machine</title><desc id="desc">Command, response, reset wait, buffering, validation, and timestamped application data.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#0f766e"/></marker><style>.t{font:700 30px Arial;fill:#172554}.h{font:700 19px Arial;fill:#172554}.n{font:16px Arial;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arrow{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1280" height="560" rx="24" fill="#f8fafc"/><text x="60" y="62" class="t">Robust UART host flow</text>
  <g transform="translate(45 155)"><rect width="180" height="105" rx="16" class="box"/><text x="90" y="43" text-anchor="middle" class="h">Send command</text><text x="90" y="73" text-anchor="middle" class="n">lowercase + LF/CR</text></g>
  <g transform="translate(265 155)"><rect width="190" height="105" rx="16" class="box"/><text x="95" y="43" text-anchor="middle" class="h">Classify response</text><text x="95" y="73" text-anchor="middle" class="n">= ... !</text></g>
  <g transform="translate(495 155)"><rect width="180" height="105" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="90" y="43" text-anchor="middle" class="h">Reset triggered?</text><text x="90" y="73" text-anchor="middle" class="n">wait several 100 ms</text></g>
  <g transform="translate(715 155)"><rect width="180" height="105" rx="16" class="box"/><text x="90" y="43" text-anchor="middle" class="h">Buffer packet</text><text x="90" y="73" text-anchor="middle" class="n">start marker → !</text></g>
  <g transform="translate(935 155)"><rect width="190" height="105" rx="16" class="box"/><text x="95" y="43" text-anchor="middle" class="h">Validate fields</text><text x="95" y="73" text-anchor="middle" class="n">type · length · range</text></g>
  <g transform="translate(465 380)"><rect width="350" height="105" rx="16" fill="#e6f7f5" stroke="#0f766e" stroke-width="2"/><text x="175" y="43" text-anchor="middle" class="h">Timestamp application data</text><text x="175" y="73" text-anchor="middle" class="n">retain raw frame and parser result</text></g>
  <path d="M225 208H265M455 208H495M675 208H715M895 208H935M1030 260C1030 330 815 330 700 380" class="arrow"/><path d="M585 260C585 310 640 320 640 380" class="arrow"/>
  <rect x="75" y="345" width="330" height="130" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="240" y="382" text-anchor="middle" class="h">Reject safely</text><text x="240" y="416" text-anchor="middle" class="n">malformed or undocumented frames</text><text x="240" y="446" text-anchor="middle" class="n">log evidence; keep stream synchronized</text><path d="M1030 260C1030 315 405 300 405 365" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#a)"/>
</svg>
