<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">AS-613 exclusion zone geometry</title><desc id="desc">XZ plan showing center coordinates, half widths, a false reflector, and a valid target outside the zone.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#0f766e"/></marker><style>.t{font:700 30px Arial;fill:#172554}.h{font:700 22px Arial;fill:#172554}.b{font:18px Arial;fill:#334155}.n{font:16px Arial;fill:#475569}.axis{stroke:#0f766e;stroke-width:4;marker-end:url(#a)}.dim{stroke:#4338ca;stroke-width:3;stroke-dasharray:8 6}</style></defs>
  <rect width="1280" height="680" rx="24" fill="#f8fafc"/><text x="60" y="62" class="t">Exclusion zone on the XZ plane</text>
  <rect x="70" y="100" width="740" height="520" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="110" y="500" width="80" height="70" rx="8" fill="#111827"/><text x="150" y="595" text-anchor="middle" class="n">Radar</text>
  <line x1="190" y1="535" x2="720" y2="535" class="axis"/><text x="735" y="543" class="b">+X</text><line x1="190" y1="535" x2="190" y2="155" class="axis"/><text x="175" y="145" class="b">+Z</text>
  <rect x="360" y="250" width="250" height="170" fill="#fee2e2" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 7"/><circle cx="485" cy="335" r="8" fill="#dc2626"/><text x="495" y="327" class="b">center (cx, cz)</text><line x1="485" y1="445" x2="610" y2="445" class="dim"/><text x="535" y="475" class="b">hx</text><line x1="635" y1="335" x2="635" y2="250" class="dim"/><text x="650" y="300" class="b">hz</text>
  <path d="M430 285l35 35m0-35l-35 35" stroke="#7f1d1d" stroke-width="7"/><text x="405" y="235" class="b">False reflector</text><circle cx="685" cy="225" r="24" fill="#14b8a6"/><text x="720" y="232" class="b">Desired target remains detectable</text>
  <rect x="850" y="120" width="360" height="450" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1030" y="165" text-anchor="middle" class="h">Configure and verify</text><text x="890" y="220" class="b">1. Select final mode/profile</text><text x="890" y="265" class="b">2. Measure center and half-widths</text><text x="890" y="310" class="b">3. Store the zone</text><text x="890" y="355" class="b">4. Query with exzinfo</text><text x="890" y="400" class="b">5. Compare packets before/after</text><rect x="890" y="450" width="280" height="72" rx="12" fill="#ecfeff" stroke="#0f766e"/><text x="1030" y="480" text-anchor="middle" class="n">Do not infer slot allocation.</text><text x="1030" y="507" text-anchor="middle" class="n">Read back every change.</text>
</svg>
